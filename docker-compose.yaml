services:
  postgres:
    image: postgres:16
    container_name: sportily-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sportily_db
      POSTGRES_USER: sportily
      POSTGRES_PASSWORD: sportily

    ports:
      - "5432:5432"

    volumes:
      - sportily_postgres_data:/var/lib/postgresql/data

volumes:
  sportily_postgres_data: